name: Deploy web to GitHub Pages

# Deploys only after CI has passed on main, or on demand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  build:
    name: Build Pages artifact
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Reads the Pages site settings. With a custom domain `base_path` is empty and the
      # app is served from "/"; without one it is "/<repo>". The build follows it, so the
      # base href can never disagree with where GitHub actually serves the site.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build (pages configuration)
        env:
          BASE_HREF: ${{ steps.pages.outputs.base_path }}/
        run: |
          echo "Serving from ${{ steps.pages.outputs.base_url }} → base href $BASE_HREF"
          npm run build:pages --workspace apps/web -- --base-href "$BASE_HREF"

      - name: Sanity-check artifact
        env:
          BASE_HREF: ${{ steps.pages.outputs.base_path }}/
        run: |
          set -e
          test -f apps/web/dist/web/browser/index.html
          test -f apps/web/dist/web/browser/404.html
          test -f apps/web/dist/web/browser/.nojekyll
          grep -q "<base href=\"$BASE_HREF\"" apps/web/dist/web/browser/index.html
          du -sh apps/web/dist/web/browser

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist/web/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
