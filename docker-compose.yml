services:
  postgres:
    image: postgres:16-alpine
    container_name: mad-studio-postgres
    environment:
      POSTGRES_USER: mad
      POSTGRES_PASSWORD: mad
      POSTGRES_DB: mad_studio
    ports:
      - '5432:5432'
    volumes:
      - mad_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mad -d mad_studio']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mad_pg:
